databases:
  - name: smartcare-db
    databaseName: smartcare
    user: smartcare_user
    plan: free
    region: oregon

services:
  - type: web
    name: smartcare-emr
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: bash build.sh
    # ── Gunicorn production config ──────────────────────────────────────
    # 2 sync workers with 5 gthread threads each = 10 concurrent requests
    # (vs default 1 sync worker = 1 req at a time, which queue-stalls on
    #  AI endpoints or slow DB lookups). --timeout 120 allows AI Groq calls.
    startCommand: gunicorn smartemr.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 5 --timeout 120 --worker-class gthread --keep-alive 5
    autoDeploy: yes
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smartcare-emr.onrender.com"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "superadmin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@smartcare.zm"
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smartcare-db
          property: connectionString
